<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Embossed sage damask: every leaf is drawn three times (shadow, light, base) so it reads as raised. -->
  <defs>
    <path id="leaf" d="M0 0C8-10 22-10 30 0C22 10 8 10 0 0Z"/>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-width="1.6">
    <path d="M12 60Q60 40 108 60" stroke="#55644a" transform="translate(1.2 1.6)"/>
    <path d="M12 60Q60 40 108 60" stroke="#c9d4b0" transform="translate(-.6 -.8)"/>
    <path d="M12 60Q60 40 108 60" stroke="#8d9d73"/>
  </g>
  <g>
    <use href="#leaf" fill="#55644a" transform="translate(25.2 57.6) rotate(-35)"/>
    <use href="#leaf" fill="#c9d4b0" transform="translate(24.4 55.2) rotate(-35)"/>
    <use href="#leaf" fill="#93a279" transform="translate(24 56) rotate(-35)"/>

    <use href="#leaf" fill="#55644a" transform="translate(73.2 41.6) rotate(-145)"/>
    <use href="#leaf" fill="#c9d4b0" transform="translate(72.4 39.2) rotate(-145)"/>
    <use href="#leaf" fill="#93a279" transform="translate(72 40) rotate(-145)"/>

    <use href="#leaf" fill="#55644a" transform="translate(49.2 49.6) rotate(-145)"/>
    <use href="#leaf" fill="#c9d4b0" transform="translate(48.4 47.2) rotate(-145)"/>
    <use href="#leaf" fill="#93a279" transform="translate(48 48) rotate(-145)"/>

    <use href="#leaf" fill="#55644a" transform="translate(97.2 61.6) rotate(-35)"/>
    <use href="#leaf" fill="#c9d4b0" transform="translate(96.4 59.2) rotate(-35)"/>
    <use href="#leaf" fill="#93a279" transform="translate(96 60) rotate(-35)"/>

    <use href="#leaf" fill="#55644a" transform="translate(-.8 .2) rotate(-35)"/>
    <use href="#leaf" fill="#c9d4b0" transform="translate(-1.6 -2.2) rotate(-35)"/>
    <use href="#leaf" fill="#93a279" transform="translate(-2 -1.6) rotate(-35)"/>
  </g>
  <g fill="#55644a" transform="translate(1.2 1.6)"><circle cx="60" cy="88" r="2"/><circle cx="20" cy="18" r="1.6"/><circle cx="100" cy="14" r="1.6"/></g>
  <g fill="#c9d4b0" transform="translate(-.6 -.8)"><circle cx="60" cy="88" r="2"/><circle cx="20" cy="18" r="1.6"/><circle cx="100" cy="14" r="1.6"/></g>
  <g fill="#93a279"><circle cx="60" cy="88" r="2"/><circle cx="20" cy="18" r="1.6"/><circle cx="100" cy="14" r="1.6"/></g>
</svg>
