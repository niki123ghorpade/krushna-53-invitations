[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# published wedding websites: /wedding/<slug> is the static /wedding page, which reads the slug from the address
[[redirects]]
  from = "/wedding/*"
  to = "/wedding.html"
  status = 200
